  --bg:#F7F3E8;--surface:#FFFDF7;--surface2:#EBE2CC;--ink:#17261D;--muted:#5C695F;
  --primary:#1F4A33;--on-primary:#FFFDF7;--primary-hover:#173A28;--line:#DDD3BA;--accent:#8A6A43;
  --deep:#14291D;--on-deep:#F3EEDF;--deep-muted:#B5C2B7;--gold:#D9BE8A;--danger:#A33A2B;--ok:#2F7A4B;
  --shadow:0 1px 2px rgba(20,41,29,.06),0 10px 28px rgba(20,41,29,.08);
  --head:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:Hind,"Segoe UI",system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1913;--surface:#15231A;--surface2:#1D2F23;--ink:#EFEADB;--muted:#A5B2A7;--primary:#8CC09B;--on-primary:#0E1913;--primary-hover:#A3D1B0;--line:#2A3D30;--accent:#CDAE7F;--deep:#0A130E;--on-deep:#EFEADB;--deep-muted:#9DAA9F;--danger:#E08B7C;--ok:#7CCB97;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{
  --bg:#0E1913;--surface:#15231A;--surface2:#1D2F23;--ink:#EFEADB;--muted:#A5B2A7;--primary:#8CC09B;--on-primary:#0E1913;--primary-hover:#A3D1B0;--line:#2A3D30;--accent:#CDAE7F;--deep:#0A130E;--on-deep:#EFEADB;--deep-muted:#9DAA9F;--danger:#E08B7C;--ok:#7CCB97;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
h1,h2,h3,h4{font-family:var(--head);letter-spacing:-.02em;line-height:1.1;margin:0 0 .5em;font-weight:700}
h1{font-size:clamp(2.2rem,5.4vw,3.8rem);font-weight:800}
h2{font-size:clamp(1.7rem,3.6vw,2.6rem)}
h3{font-size:1.25rem;letter-spacing:-.01em}
p{margin:0 0 1em}
a{color:var(--primary)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sec{padding:clamp(56px,8vw,100px) 0}
.sec.alt{background:var(--surface)}
.shead{max-width:640px;margin-bottom:clamp(28px,4vw,48px)}
.shead p{color:var(--muted);font-size:1.08rem;margin:0}
.muted{color:var(--muted)}
.ic{flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--primary);color:var(--on-primary);padding:10px 16px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;border-radius:999px;font:600 1rem/1 var(--head);letter-spacing:0;border:2px solid transparent;cursor:pointer;text-decoration:none;transition:background .2s,color .2s,transform .15s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover);box-shadow:var(--shadow)}
.btn-ghost{border-color:var(--primary);color:var(--primary);background:transparent}
.btn-ghost:hover{background:var(--primary);color:var(--on-primary)}
.btn-lg{min-height:56px;padding:0 30px;font-size:1.05rem}
.btn-sm{min-height:40px;padding:0 16px;font-size:.92rem}
.btn-danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn-danger:hover{background:var(--danger);color:var(--surface)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}
/* announce + header */
#announce{background:var(--deep);color:var(--on-deep);text-align:center;font-size:.93rem;padding:9px 16px;line-height:1.4}
#announce b{color:var(--gold);font-weight:600}
#announce i{font-style:normal;color:var(--gold);margin:0 .5em}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr .wrap{max-width:1320px;display:flex;align-items:center;flex-wrap:wrap;column-gap:14px;min-height:68px}
.logo{order:1;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);padding:8px 0}
.cow{display:block;aspect-ratio:2/1;background:currentColor;-webkit-mask:var(--cow) center/contain no-repeat;mask:var(--cow) center/contain no-repeat}
.logo .cow{width:58px;color:var(--primary)}
.wm{font:700 1.02rem/1.1 var(--head);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.wm span{font-weight:400;opacity:.45;margin:0 .35em}
.sp{order:2;flex:1}
.nav{order:6;flex-basis:100%;display:none}
.nav.open{display:block;padding-bottom:12px}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:block;padding:12px 14px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:600}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current="page"]{color:var(--primary);background:var(--surface2)}
.loc{order:5;flex-basis:100%;display:flex;align-items:center;justify-content:center;gap:6px;font-size:.82rem;font-weight:600;color:var(--primary);padding:0 0 8px}
.cartbtn{order:3;position:relative;width:46px;height:46px;border-radius:50%;border:0;background:var(--surface2);color:var(--ink);display:grid;place-items:center;cursor:pointer;text-decoration:none}
.cartbtn:hover{background:var(--line)}
.cbadge{position:absolute;top:-2px;right:-2px;min-width:21px;height:21px;padding:0 5px;border-radius:999px;background:var(--primary);color:var(--on-primary);font:700 .75rem/21px var(--head);text-align:center}
.cbadge[hidden]{display:none}
.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.28)}}
.burger{order:4;width:46px;height:46px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
@media (min-width:920px){
  .hdr .wrap{flex-wrap:nowrap}
  .nav{order:2;flex-basis:auto;display:block;margin-left:18px}
  .nav ul{flex-direction:row}
  .nav a{padding:8px 13px;font-size:.98rem;white-space:nowrap}
  .burger{display:none}
  .loc{order:4;flex-basis:auto;white-space:nowrap;padding:6px 13px;background:var(--surface2);border-radius:999px;margin-right:2px}
}
/* hero */
.hero{position:relative;overflow:hidden;padding:clamp(36px,6vw,72px) 0 clamp(48px,7vw,88px)}
.hero::before{content:"";position:absolute;left:-4%;bottom:-2%;width:min(400px,60vw);aspect-ratio:2/1;background:var(--primary);opacity:.05;-webkit-mask:var(--cow) center/contain no-repeat;mask:var(--cow) center/contain no-repeat;pointer-events:none}
.hero-grid{position:relative;display:grid;gap:40px;align-items:center}
@media (min-width:920px){.hero-grid{grid-template-columns:1.08fr .92fr;gap:56px}}
.badge-loc{display:inline-flex;align-items:center;gap:8px;margin:0 0 22px;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.92rem;font-weight:600;color:var(--primary)}
.lead{font-size:1.2rem;color:var(--muted);max-width:34em;margin-bottom:28px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:34px}
.facts{list-style:none;margin:0;padding:22px 0 0;border-top:1px solid var(--line);display:grid;gap:14px}
.facts li{display:flex;align-items:center;gap:12px;font-weight:600}
.ficon{width:40px;height:40px;border-radius:50%;background:var(--surface2);color:var(--primary);display:grid;place-items:center;font:700 1.1rem var(--head);flex:none}
@media (min-width:640px){.facts{grid-template-columns:repeat(3,auto);justify-content:start;gap:28px}}

.oc-a select{width:auto;min-height:40px;padding:4px 10px}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.flow span{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
.flow span.done{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.flow span.cur{border-color:var(--primary);color:var(--primary)}
.warnbar{background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid var(--accent);border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:.93rem}
.arow{display:grid;gap:12px;align-items:end;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.tgl{display:flex;gap:8px;align-items:center;font-weight:600}.tgl input{width:20px;min-height:0;height:20px;accent-color:var(--primary)}
.legal{max-width:720px;padding-bottom:70px}.legal h2{font-size:1.35rem;margin-top:1.8em}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.js .rv{opacity:1;transform:none}}
</style>

const mem={};
const DB={r(k,d){try{const v=localStorage.getItem('ags:'+k);if(v!==null)return JSON.parse(v)}catch(e){}return k in mem?mem[k]:d},
          w(k,v){mem[k]=v;try{localStorage.setItem('ags:'+k,JSON.stringify(v))}catch(e){}},
          sr(k){try{return sessionStorage.getItem('ags:'+k)}catch(e){return mem['s'+k]}},

let settings=load();function load(){const s=DB.r('settings',{});return{...D_SETTINGS,...s,contact:{...D_SETTINGS.contact,...(s.contact||{})}}}
let products=DB.r('products',D_PRODUCTS);
let cart=DB.r('cart',{});
const saveSettings=()=>{DB.w('settings',settings);syncLD()};
const saveProducts=()=>{DB.w('products',products);syncLD()};

const milk=()=>products.find(p=>p.id==='p-a2-milk')||products.find(p=>p.active)||products[0];
const maxQ=()=>Math.max(1,+settings.maxQty||20);

/* ---------- cart + delivery logic ---------- */
function cartDetail(){const lines=[];let sub=0;
  for(const[pid,q]of Object.entries(cart)){const p=products.find(x=>x.id===pid&&x.active);if(!p)continue;const t=p.price*q;sub+=t;lines.push({p,q,t})}
  const dc=deliveryFor(sub);return{lines,sub,dc,total:sub+dc,units:lines.reduce((a,l)=>a+l.q,0)}}
function deliveryFor(sub){if(!sub)return 0;const f=+settings.freeDeliveryAbove;if(f>0&&sub>=f)return 0;return +settings.deliveryCharge||0}
const zonePins=()=>settings.zones.filter(z=>z.active).flatMap(z=>z.pincodes);
function areaCheck(city,pin){const pins=zonePins();return{cityOk:norm(city)===norm(settings.serviceCity),pinOk:pins.length?pins.includes(String(pin).trim()):true}}
const cartAdd=(pid,q)=>{cart[pid]=Math.min(maxQ(),(cart[pid]||0)+q);saveCart()};
const cartSet=(pid,q)=>{cart[pid]=Math.max(1,Math.min(maxQ(),q));saveCart()};
const cartDel=pid=>{delete cart[pid];saveCart()};

/* ---------- payments (modular: add a provider here, e.g. Razorpay) ---------- */
const Payments={providers:{
  cod:{async start(order){return{status:'pending'}}},   // cash collected on delivery
  upi:{async start(order){
    /* Razorpay hook (needs server):
       1. POST /api/payments/razorpay/order {orderId} -> {rzpOrderId,key}
       2. open Razorpay Checkout with that id
       3. server verifies signature on webhook, marks payment 'paid' */
    throw new Error('Online payment is not connected yet.')}}},
  async process(order){const p=this.providers[order.payment.method];if(!p)throw new Error('Unknown payment method');return p.start(order)}};

/* ---------- orders ---------- */
const STATUS=[['new','New Order'],['confirmed','Confirmed'],['preparing','Preparing'],['out_for_delivery','Out for Delivery'],['delivered','Delivered']];
const sLabel=s=>s==='cancelled'?'Cancelled':(STATUS.find(x=>x[0]===s)||[0,s])[1];
function newOrderId(){const d=new Date(),y=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<4;i++)r+=a[Math.floor(Math.random()*a.length)];return`AGS-${y}-${r}`}
function createOrder(f){const c=cartDetail();const at=new Date().toISOString();const pm=settings.payments.find(x=>x.id===f.payment);
  const o={id:newOrderId(),createdAt:at,status:'new',statusHistory:[{status:'new',at}],
    customer:{name:f.name,mobile:f.mobile,altMobile:f.alt},
    address:{house:f.house,full:f.address,locality:f.locality,landmark:f.landmark,city:f.city,pin:f.pin},
    slot:f.slot,notes:f.notes,
    items:c.lines.map(l=>({productId:l.p.id,name:l.p.name,unitPrice:l.p.price,qty:l.q,unit:l.p.unitShort})),
    subtotal:c.sub,deliveryCharge:c.dc,total:c.total,payment:{method:f.payment,label:pm?pm.label:f.payment,status:'pending'}};
  DB.w('orders',[o,...orders()]);return o}
function updateOrder(id,fn){const all=orders();const o=all.find(x=>x.id===id);if(o){fn(o);DB.w('orders',all)}}
function setStatus(id,s){updateOrder(id,o=>{o.status=s;o.statusHistory.push({status:s,at:new Date().toISOString()})})}

 $('#main').innerHTML=out.html;setMeta(out.title,out.desc,out.noindex);
 $$('.nav a').forEach(a=>{const on=a.dataset.nav===r.name||(r.name==='product'&&a.dataset.nav==='shop');on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
 $('#nav').classList.remove('open');$('#burger').setAttribute('aria-expanded','false');
 if(reset){window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true})}
 cartUI();observe()}
function observe(){const els=$$('.rv');if(!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('in'));return}
 io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px',threshold:.05});els.forEach(e=>io.observe(e))}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 if(e.target.closest('#burger')){const n=$('#nav'),o=n.classList.toggle('open');$('#burger').setAttribute('aria-expanded',o)}
 const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,pid=t.dataset.pid;
 if(a==='qty'){const d=+t.dataset.d;
   if(t.dataset.ctx==='cart'){cartSet(pid,(cart[pid]||1)+d);render(false);return}
   const q=t.closest('.qty'),o=$('.qv',q);const v=Math.max(1,Math.min(maxQ(),(+o.dataset.v)+d));o.dataset.v=v;o.textContent=v+' '+o.dataset.unit;
   $$('button',q)[0].disabled=v<=1;const card=t.closest('[data-card]'),p=products.find(x=>x.id===(card&&card.dataset.pid));const tot=card&&$('[data-total]',card);if(tot&&p)tot.textContent=inr(p.price*v)}
 else if(a==='add'||a==='buy'){const card=t.closest('[data-card]');const v=+$('.qv',card).dataset.v;const p=products.find(x=>x.id===pid);cartAdd(pid,v);
   if(a==='buy'){location.hash='#/checkout';return}
   toast(`Added ${v} ${p.unitShort} ${p.name} to your cart`,['View cart','#/cart']);const o=t.textContent;t.textContent='Added';setTimeout(()=>t.textContent=o,1200)}
 else if(a==='rm'){cartDel(pid);render(false)}
 else if(a==='gal'){const p=products.find(x=>x.id===t.closest('[data-gal]').dataset.gal);const i=+t.dataset.i;$('#gmain').innerHTML=media({images:p.images},i,true);$$('.gthumbs button').forEach((b,j)=>b.setAttribute('aria-pressed',j===i))}
 else if(a==='pincheck'){const v=$('#pinq').value.trim(),s=$('#pinstat');if(!/^\d{6}$/.test(v)){s.className='pstat';s.style.color='var(--danger)';s.textContent='Enter a 6-digit PIN code.';return}
   const ok=areaCheck(settings.serviceCity,v).pinOk;s.style.color=ok?'var(--ok)':'var(--danger)';s.textContent=ok?'Good news, we deliver to this PIN code.':`Sorry, we do not deliver to ${v} yet. We currently serve ${settings.serviceCity} only.`}
 else if(a.startsWith('a-'))adminClick(a,t)});
function adminClick(a,t){
 if(a==='a-logout'){DB.sw('admin','');render(false)}
 else if(a==='a-tab'){A.tab=t.dataset.tab;render(false)}
 else if(a==='a-next'){setStatus(t.dataset.id,t.dataset.s);render(false)}
 else if(a==='a-paid'){updateOrder(t.dataset.id,o=>o.payment.status=o.payment.status==='paid'?'pending':'paid');render(false)}
 else if(a==='a-cancel'){if(A.cancelArm===t.dataset.id){setStatus(t.dataset.id,'cancelled');A.cancelArm=''}else A.cancelArm=t.dataset.id;render(false)}
 else if(a==='a-addzone'){collectSettings($('#aset'));settings.zones.push({id:'z'+Date.now(),name:'New zone',pincodes:[],active:true});saveSettings();render(false)}
 else if(a==='a-delzone'){collectSettings($('#aset'));settings.zones.splice(+t.dataset.i,1);saveSettings();render(false)}
 else if(a==='a-delreview'){settings.testimonials.splice(+t.dataset.i,1);saveSettings();render(false)}
 else if(a==='a-reset'){if(A.resetArm){['settings','products','orders','cart','draft'].forEach(k=>{try{localStorage.removeItem('ags:'+k)}catch(e){}delete mem[k]});settings=load();products=DB.r('products',D_PRODUCTS);cart={};A.resetArm=false;chrome();syncLD();toast('Preview data erased');render(false)}else{A.resetArm=true;render(false)}}}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.act==='a-filter'){A.filter=t.value;render(false)}
 else if(t.dataset.act==='a-setstatus'){setStatus(t.dataset.id,t.value);render(false)}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='asearch'){A.q=t.value;const pos=t.selectionStart;render(false);const n=$('#asearch');n.focus();n.setSelectionRange(pos,pos)}
 if(t.id==='f-pin'||t.id==='f-city')pinLive()});
function pinLive(){const s=$('#pin-status');if(!s)return;const pin=$('#f-pin').value.trim(),city=$('#f-city').value;
 if(!/^\d{6}$/.test(pin)&&norm(city)===norm(settings.serviceCity)){s.textContent='';return}
 const r=areaCheck(city,pin);let m='',c='var(--ok)';
 if(!r.cityOk){m=`We deliver in ${settings.serviceCity} only. This city is outside our service area.`;c='var(--danger)'}
 else if(/^\d{6}$/.test(pin)){if(r.pinOk)m='Good news, we deliver to this PIN code.';else{m=`Sorry, we do not deliver to ${pin} yet. We currently serve ${settings.serviceCity} only.`;c='var(--danger)'}}
 s.textContent=m;s.style.color=c}
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;const k=f.dataset.form;if(!k)return;
 if(k==='checkout')return submitCheckout(f);
 if(k==='a-login'){if(f.elements.pin.value.trim()===String(settings.adminPin)){DB.sw('admin','1');render(false)}else{const fl=f.querySelector('.field');fl.classList.add('bad');$('#e-apin').textContent='That PIN is not correct. Try again.'}return}
 const g=n=>f.elements[n];
 if(k==='a-prod'){const p=products.find(x=>x.id===f.dataset.pid);Object.assign(p,{name:g('name').value.trim()||p.name,price:Math.max(0,+g('price').value||0),unit:g('unit').value.trim()||p.unit,unitShort:g('unitShort').value.trim()||p.unitShort,badge:g('badge').value.trim(),short:g('short').value.trim(),active:g('active').checked,comingSoon:g('comingSoon').checked});
   if(p.active&&!p.price){toast('Set a price above ₹0 before making a product available.');p.active=false}saveProducts();chrome();toast('Product saved');render(false)}
 else if(k==='a-newprod'){const name=g('name').value.trim();products.push({id:'p-'+Date.now(),slug:name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'item-'+Date.now(),name,price:Math.max(0,+g('price').value||0),unit:g('unit').value.trim(),unitShort:g('unitShort').value.trim(),badge:'',active:false,comingSoon:true,short:g('short').value.trim(),images:[]});saveProducts();toast('Product added as Coming soon. Open it above to make it available.');render(false)}
 else if(k==='a-settings'){collectSettings(f);saveSettings();chrome();toast('Settings saved');render(false)}
 else if(k==='a-review'){settings.testimonials.push({name:g('name').value.trim(),text:g('text').value.trim()});saveSettings();render(false)}});

function submitCheckout(f){
 const g=n=>f.elements[n],val=n=>(g(n).value||'').trim();const errs={};
 const mob=s=>String(s).replace(/[\s-]/g,'').replace(/^(\+91|91|0)(?=\d{10}$)/,'');
 const fd={name:val('name'),mobile:mob(val('mobile')),alt:mob(val('alt')),house:val('house'),address:val('address'),locality:val('locality'),landmark:val('landmark'),city:val('city'),pin:val('pin'),slot:val('slot'),notes:val('notes'),payment:(f.querySelector('input[name=payment]:checked')||{}).value};
 if(fd.name.length<2)errs.name='Please enter your full name.';
 if(!/^[6-9]\d{9}$/.test(fd.mobile))errs.mobile='Enter a valid 10-digit mobile number.';
 if(fd.alt&&!/^[6-9]\d{9}$/.test(fd.alt))errs.alt='Enter a valid 10-digit number or leave this blank.';
 if(!fd.house)errs.house='Enter your house or flat number.';
 if(fd.address.length<8)errs.address='Enter your complete address.';
 if(!fd.locality)errs.locality='Enter your locality or area.';
 const ar=areaCheck(fd.city,fd.pin);
 if(!fd.city)errs.city='Enter your city.';else if(!ar.cityOk)errs.city=`We deliver in ${settings.serviceCity} only. Please contact us if you are unsure.`;
 if(!/^\d{6}$/.test(fd.pin))errs.pin='Enter a valid 6-digit PIN code.';else if(!ar.pinOk)errs.pin=`We do not deliver to ${fd.pin} yet.`;
 if(!f.elements.confirm.checked)errs.confirm=`Please confirm that your address is within ${settings.serviceCity}.`;
 if(!fd.payment)errs.confirm=errs.confirm||'Choose a payment method.';
 $$('.field',f).forEach(x=>x.classList.remove('bad'));$$('.err',f).forEach(x=>x.textContent='');
 const keys=Object.keys(errs);const msg=$('#formmsg');
 if(keys.length){keys.forEach(k=>{const fl=$(`[data-f="${k}"]`,f);if(fl){fl.classList.add('bad');$('#e-'+k).textContent=errs[k]}});
   const out=(errs.city||errs.pin)&&(!ar.cityOk||!ar.pinOk);
   msg.hidden=false;msg.innerHTML=`${ic('info',20)}<span>${out?`Delivery is currently available only in ${esc(settings.serviceCity)}. We cannot accept this address yet.`:'Please fix the highlighted fields.'}</span>`;
   const first=$(`[data-f="${keys[0]}"]`,f);first&&first.scrollIntoView({behavior:'smooth',block:'center'});const inp=first&&$('input,select,textarea',first);inp&&inp.focus({preventScroll:true});return}
 msg.hidden=true;const btn=$('#placebtn');btn.disabled=true;btn.textContent='Placing your order…';
 DB.w('draft',{name:fd.name,mobile:fd.mobile,alt:fd.alt,house:fd.house,address:fd.address,locality:fd.locality,landmark:fd.landmark,city:fd.city,pin:fd.pin,slot:fd.slot});
 const c=cartDetail();if(!c.lines.length){location.hash='#/cart';return}
 const o=createOrder(fd);
 Payments.process(o).then(r=>{updateOrder(o.id,x=>x.payment.status=r.status);cart={};saveCart();location.hash='#/confirmation/'+o.id})
  .catch(err=>{updateOrder(o.id,x=>x.status='cancelled');btn.disabled=false;btn.textContent='Place order · '+inr(c.total);msg.hidden=false;msg.innerHTML=`${ic('info',20)}<span>${esc(err.message)} Please choose Cash on Delivery or try again.</span>`})}

window.addEventListener('hashchange',()=>render(true));
syncLD();chrome();render(true);
})();
</script>
